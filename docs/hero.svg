<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">agent-session-compare</title>
  <desc id="desc">A visual comparison between Codex and Claude coding agent sessions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17243c"/><stop offset=".55" stop-color="#0b0d12"/><stop offset="1" stop-color="#281729"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="500" rx="30" fill="url(#bg)"/>
  <circle cx="145" cy="120" r="80" fill="#61dafb" opacity=".12" filter="url(#glow)"/><circle cx="1050" cy="370" r="95" fill="#ff73b5" opacity=".12" filter="url(#glow)"/>
  <text x="600" y="82" text-anchor="middle" fill="#6ee7a8" font-family="ui-monospace,monospace" font-size="20" letter-spacing="4">DETERMINISTIC SESSION DIFF</text>
  <text x="600" y="162" text-anchor="middle" fill="#f4f6fb" font-family="system-ui,sans-serif" font-size="62" font-weight="750">Same task. Different agent.</text>
  <g transform="translate(115 220)"><rect width="420" height="175" rx="22" fill="#141821" stroke="#2a3040"/><text x="32" y="42" fill="#9ba5b7" font-family="ui-monospace,monospace" font-size="16">LEFT</text><text x="32" y="92" fill="#61dafb" font-family="system-ui,sans-serif" font-size="42" font-weight="700">Codex</text><text x="32" y="132" fill="#9ba5b7" font-family="ui-monospace,monospace" font-size="18">5 turns · 12 tools · 1 error</text></g>
  <g transform="translate(665 220)"><rect width="420" height="175" rx="22" fill="#141821" stroke="#2a3040"/><text x="388" y="42" text-anchor="end" fill="#9ba5b7" font-family="ui-monospace,monospace" font-size="16">RIGHT</text><text x="388" y="92" text-anchor="end" fill="#ff73b5" font-family="system-ui,sans-serif" font-size="42" font-weight="700">Claude</text><text x="388" y="132" text-anchor="end" fill="#9ba5b7" font-family="ui-monospace,monospace" font-size="18">6 turns · 16 tools · 2 errors</text></g>
  <circle cx="600" cy="307" r="38" fill="#0b0d12" stroke="#2a3040"/><text x="600" y="315" text-anchor="middle" fill="#9ba5b7" font-family="system-ui,sans-serif" font-size="21" font-weight="800">VS</text>
  <text x="600" y="452" text-anchor="middle" fill="#9ba5b7" font-family="ui-monospace,monospace" font-size="17">local-only · text excluded · no telemetry</text>
</svg>
